name: Deploy RestaurantOS Web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      # Public frontend configuration is secret-overridable but has safe production defaults.
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests, and production build
        run: npm run verify

      - name: Resolve frontend deployment configuration
        run: |
          VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://restaurantos-xqi52dpwgo-as.a.run.app}"
          VITE_PUBLIC_APP_URL="${VITE_PUBLIC_APP_URL:-https://restaurantos01.ai.studio}"
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_APP_URL=$VITE_PUBLIC_APP_URL" >> "$GITHUB_ENV"

      - name: Validate frontend deployment configuration
        run: |
          test -n "$VITE_API_BASE_URL"
          test -n "$VITE_PUBLIC_APP_URL"
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo "VITE_API_BASE_URL must use HTTPS in production"; exit 1 ;; esac
          case "$VITE_PUBLIC_APP_URL" in https://*) ;; *) echo "PUBLIC_APP_URL must use HTTPS in production"; exit 1 ;; esac

      - name: Build frontend for GitHub Pages
        run: npm run build:web
        env:
          VITE_BASE_PATH: /restorent-os/
          # VITE_API_BASE_URL and VITE_PUBLIC_APP_URL are resolved above and exported to GITHUB_ENV.

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy RestaurantOS Web to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
