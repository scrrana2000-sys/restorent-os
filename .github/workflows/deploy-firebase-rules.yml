name: Deploy Firebase Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-rules-production
  cancel-in-progress: false

jobs:
  deploy-rules:
    name: Deploy Firestore Rules & Indexes
    runs-on: ubuntu-latest
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate with Workload Identity Federation
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate with Service Account JSON
        if: ${{ env.GCP_CREDENTIALS_JSON != '' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Validate Google Cloud authentication
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Using Workload Identity Federation."
          elif [ -n "$GCP_CREDENTIALS_JSON" ]; then
            echo "Using service-account JSON."
          else
            echo "::error::Google Cloud authentication is not configured."
            exit 1
          fi

      - name: Validate Firebase project and rules configuration
        run: |
          test -f firebase.json
          test -f .firebaserc
          test -f firestore.rules
          test -f storage.rules
          node -e "const f=require('./firebase.json'); if (!Array.isArray(f.firestore)||!f.firestore.length) process.exit(1); if (!f.storage || !f.storage.rules) process.exit(1); console.log('Firestore targets:', f.firestore.map(x => x.database).join(', ')); console.log('Storage rules:', f.storage.rules);"

      - name: Deploy Firestore rules, indexes, and Storage rules
        run: |
          FIREBASE_PROJECT_ID="$(node -e "const fs=require('fs'); const f=JSON.parse(fs.readFileSync('.firebaserc','utf8')); process.stdout.write(f.projects.default)")"
          test -n "$FIREBASE_PROJECT_ID"
          echo "Deploying Firebase project: $FIREBASE_PROJECT_ID"
          firebase deploy --only firestore --project "$FIREBASE_PROJECT_ID" --non-interactive

