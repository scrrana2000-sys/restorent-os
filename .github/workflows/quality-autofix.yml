name: RestaurantOS Auto Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restaurantos-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Apply safe lint and formatting fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: ESLint auto-fix
        continue-on-error: true
        run: npm run lint:eslint:fix

      - name: Prettier auto-fix
        run: npm run format:fix

      - name: Stylelint auto-fix
        continue-on-error: true
        run: npm run lint:css:fix

      - name: Commit safe fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':!package-lock.json' ':!package.json'
          if git diff --cached --quiet; then
            echo "No auto-fix changes."
            exit 0
          fi
          git commit -m "chore: auto-fix lint and formatting [skip ci]"
          git push
