name: Deploy RestaurantOS API to Cloud Run

# Keep the API deployment synchronized with main so the frontend can never point
# at a stale Cloud Run revision after server-side changes.
# Build the production container on GitHub Actions and publish it as a public GitHub Container Registry image.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm install --no-audit --no-fund --package-lock=false

      - run: npm run verify

      - name: Reproduce production Docker build
        run: DOCKER_BUILDKIT=1 docker build --progress=plain --pull -t restaurantos-cloud-run-debug .

  deploy:
    name: Build image and deploy API
    runs-on: ubuntu-latest
    needs: verify
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GHCR_IMAGE: ghcr.io/scrrana2000-sys/restaurantos-api-cloudrun

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Google Cloud auth: Workload Identity Federation configured."
          elif [ -n "$GCP_CREDENTIALS_JSON" ]; then
            echo "Google Cloud auth: service-account JSON configured."
          else
            echo "::error::Google Cloud deployment credentials are missing."
            exit 1
          fi

          test -n "$CLOUD_RUN_SERVICE" || { echo "::error::CLOUD_RUN_SERVICE is missing."; exit 1; }
          test -n "$GCP_REGION" || { echo "::error::GCP_REGION is missing."; exit 1; }
          test -n "$GCP_PROJECT_ID" || { echo "::error::GCP_PROJECT_ID is missing."; exit 1; }

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with Service Account JSON
        if: ${{ env.GCP_CREDENTIALS_JSON != '' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image to GitHub Container Registry
        run: |
          set -euo pipefail
          IMAGE_TAG="${GHCR_IMAGE}:${GITHUB_SHA}"
          echo "Building and publishing $IMAGE_TAG"
          DOCKER_BUILDKIT=1 docker build --progress=plain --pull --platform linux/amd64 -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

          # Verify the pushed image is publicly readable before Cloud Run uses it.
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Published and anonymously readable: $IMAGE_TAG"
      - name: Deploy production image to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE_TAG" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --update-env-vars "^@^NODE_ENV=production@PUBLIC_APP_URL=https://restaurantos01.ai.studio@ALLOWED_ORIGINS=https://restaurantos01.ai.studio,https://antos01.ai.studio,https://restaurantos-xqi52dpwga-el.a.run.app,https://scrrana2000-sys.github.io@SYSTEM_SERVER_UID=restaurantos-system-server@FIREBASE_PROJECT_ID=project-0edd3716-fc3b-40b7-b96@FIRESTORE_DATABASE_ID=ai-studio-restaurantos-16bfb108-09a4-44fb-9463-1d58d938bd57" \
            --remove-secrets "SYSTEM_SERVER_PASSWORD,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET" \
            --quiet

      - name: Wait for new Cloud Run revision and verify API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            CREATED="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.latestCreatedRevisionName)')"
            READY="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.latestReadyRevisionName)')"
            echo "Cloud Run revision status: created=$CREATED ready=$READY (attempt $attempt/30)"
            if [ "$attempt" = "1" ] || [ "$attempt" = "10" ]; then
              gcloud run revisions describe "$CREATED" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='yaml(status.conditions,status.containerStatuses)' || true
            fi
            if [ -n "$CREATED" ] && [ "$CREATED" = "$READY" ]; then
              URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
              test -n "$URL"
              echo "Cloud Run URL: $URL"
              curl --fail --silent --show-error --retry 6 --retry-delay 3 "$URL/api/health"
              curl --fail --silent --show-error --retry 6 --retry-delay 3 "$URL/"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloud Run latest revision did not become ready within 5 minutes."
          echo "=== Cloud Run revision diagnostics ==="
          REVISION="$CREATED"
          gcloud run revisions describe "$REVISION" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='yaml(metadata.name,status.conditions,status.containerStatuses,spec.containers)' || true
          echo "=== Recent Cloud Run logs for the revision ==="
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$CLOUD_RUN_SERVICE AND resource.labels.revision_name=$REVISION" --project "$GCP_PROJECT_ID" --limit=80 --order=desc --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          exit 1