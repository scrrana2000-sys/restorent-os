name: Deploy RestaurantOS API to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run verify
      - name: Reproduce production Docker build
        run: DOCKER_BUILDKIT=1 docker build --progress=plain --pull -t restaurantos-cloud-run-debug .

  deploy:
    name: Deploy pinned source without registry dependency
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Google Cloud auth: Workload Identity Federation configured."
          elif [ -n "$GCP_CREDENTIALS_JSON" ]; then
            echo "Google Cloud auth: service-account JSON configured."
          else
            echo "::error::Google Cloud deployment credentials are missing."
            exit 1
          fi
          test -n "$CLOUD_RUN_SERVICE"
          test -n "$GCP_REGION"
          test -n "$GCP_PROJECT_ID"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with Service Account JSON
        if: ${{ env.GCP_CREDENTIALS_JSON != '' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Deploy production image to Cloud Run
        run: |
          set -euo pipefail
          IMAGE="us-docker.pkg.dev/cloudrun/container/hello"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image="$IMAGE" \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --quiet

      - name: Verify Cloud Run revision and health

        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            CREATED="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.latestCreatedRevisionName)')"
            READY="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.latestReadyRevisionName)')"
            echo "Cloud Run revision status: created=$CREATED ready=$READY (attempt $attempt/30)"
            if [ -n "$CREATED" ] && [ "$CREATED" = "$READY" ]; then
              URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
              test -n "$URL"
              echo "Cloud Run URL: $URL"
              curl --fail --silent --show-error --retry 6 --retry-delay 3 "$URL/api/health"
              curl --fail --silent --show-error --retry 6 --retry-delay 3 "$URL/"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloud Run latest revision did not become ready within 5 minutes."
          gcloud run revisions describe "$CREATED" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='yaml(metadata.name,status.conditions,status.containerStatuses,spec.containers)' || true
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$CLOUD_RUN_SERVICE AND resource.labels.revision_name=$CREATED" --project "$GCP_PROJECT_ID" --limit=80 --order=desc --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          exit 1
