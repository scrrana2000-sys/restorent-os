name: Deploy RestaurantOS API to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit, type-check, tests, and production build
        run: npm run verify

  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE }}
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: .
          env_vars: |
            NODE_ENV=production
            PORT=3000
            PUBLIC_APP_URL=https://restaurantos01.ai.studio
            ALLOWED_ORIGINS=https://restaurantos01.ai.studio,https://restaurantos-xqi52dpwgo-as.a.run.app
          flags: '--allow-unauthenticated'
          secrets: |
            SYSTEM_SERVER_PASSWORD=SYSTEM_SERVER_PASSWORD:latest
            RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest
            RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest
            RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest

      - name: Verify deployed API health endpoint
        run: |
          URL="$(gcloud run services describe "${{ secrets.CLOUD_RUN_SERVICE }}" --region "${{ secrets.GCP_REGION }}" --project "${{ secrets.GCP_PROJECT_ID }}" --format='value(status.url)')"
          test -n "$URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/api/health"
