name: Deploy RestaurantOS API to Cloud Run

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm install --no-audit --no-fund --package-lock=false

      - run: npm run verify

      - name: Reproduce production Docker build
        run: DOCKER_BUILDKIT=1 docker build --progress=plain --pull -t restaurantos-cloud-run-debug .

  deploy:
    name: Build image and deploy API
    runs-on: ubuntu-latest
    needs: verify
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_NAME: ghcr.io/scrrana2000-sys/restaurantos-api

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Google Cloud auth: Workload Identity Federation configured."
          elif [ -n "$GCP_CREDENTIALS_JSON" ]; then
            echo "Google Cloud auth: service-account JSON configured."
          else
            echo "::error::Google Cloud deployment credentials are missing."
            exit 1
          fi

          test -n "$CLOUD_RUN_SERVICE" || { echo "::error::CLOUD_RUN_SERVICE is missing."; exit 1; }
          test -n "$GCP_REGION" || { echo "::error::GCP_REGION is missing."; exit 1; }
          test -n "$GCP_PROJECT_ID" || { echo "::error::GCP_PROJECT_ID is missing."; exit 1; }

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with Service Account JSON
        if: ${{ env.GCP_CREDENTIALS_JSON != '' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/scrrana2000-sys/restorent-os
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify GHCR package is anonymously pullable
        run: |
          echo "Checking public image manifest..."
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker manifest inspect "${{ env.IMAGE_NAME }}:${{ github.sha }}" >/dev/null

      - name: Deploy prebuilt container image to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PUBLIC_APP_URL=https://restaurantos01.ai.studio
            SYSTEM_SERVER_UID=restaurantos-system-server
            FIREBASE_PROJECT_ID=project-0edd3716-fc3b-40b7-b96
          flags: '--allow-unauthenticated'
          secrets: |
            RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest
            RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest
            RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest

      - name: Verify deployed API health endpoint
        run: |
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          test -n "$URL"
          echo "Cloud Run URL: $URL"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$URL/api/health"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$URL/"
