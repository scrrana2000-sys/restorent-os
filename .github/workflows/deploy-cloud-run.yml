name: Deploy RestaurantOS API to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm run verify
      - name: Reproduce production Docker build
        run: DOCKER_BUILDKIT=1 docker build --progress=plain --pull -t restaurantos-cloud-run-debug .

  deploy:
    name: Build in Cloud Build and deploy native Artifact Registry image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GAR_REPOSITORY: restaurantos
      GAR_IMAGE_NAME: restaurantos-api

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Google Cloud auth: Workload Identity Federation configured."
          elif [ -n "$GCP_CREDENTIALS_JSON" ]; then
            echo "Google Cloud auth: service-account JSON configured."
          else
            echo "::error::Google Cloud deployment credentials are missing."
            exit 1
          fi
          test -n "$CLOUD_RUN_SERVICE"
          test -n "$GCP_REGION"
          test -n "$GCP_PROJECT_ID"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with Service Account JSON
        if: ${{ env.GCP_CREDENTIALS_JSON != '' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Configure native Artifact Registry
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$GAR_REPOSITORY"               --repository-format=docker               --location="$GCP_REGION"               --project="$GCP_PROJECT_ID"               --description="RestaurantOS production containers"
          fi
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Start production image build in Google Cloud Build
        id: cloud-build
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${GAR_IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          set +e
          BUILD_OUTPUT="$(gcloud builds submit .             --project="$GCP_PROJECT_ID"             --tag="$IMAGE"             --machine-type=e2-highcpu-8             --async 2>&1)"
          BUILD_EXIT=$?
          set -e

          printf '%s\n' "$BUILD_OUTPUT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::Cloud Build submission failed."
            exit "$BUILD_EXIT"
          fi

          BUILD_ID="$(printf '%s\n' "$BUILD_OUTPUT" | grep -oE '/builds/[a-zA-Z0-9-]+' | tail -1 | cut -d/ -f3)"
          test -n "$BUILD_ID" || {
            echo "::error::Could not determine Cloud Build ID."
            exit 1
          }

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Cloud Build started: $BUILD_ID"

      - name: Wait for Cloud Build completion
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS="$(gcloud builds describe "$BUILD_ID" --project="$GCP_PROJECT_ID" --format='value(status)' 2>/dev/null || true)"
            echo "Cloud Build status: ${STATUS:-UNKNOWN} (attempt $attempt/60)"

            case "$STATUS" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build did not complete successfully."
                gcloud builds describe "$BUILD_ID" --project="$GCP_PROJECT_ID"                   --format='yaml(id,status,createTime,startTime,finishTime,results,failureInfo,steps)' || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Cloud Build did not finish within 10 minutes."
          gcloud builds describe "$BUILD_ID" --project="$GCP_PROJECT_ID"             --format='yaml(id,status,createTime,startTime,finishTime,results,failureInfo,steps)' || true
          exit 1

      - name: Verify Artifact Registry image exists
        run: |
          set -euo pipefail
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE"             --project="$GCP_PROJECT_ID"             --format='value(image_summary.digest)')"
          test -n "$DIGEST"
          echo "Artifact Registry image ready: $DIGEST"

      - name: Deploy native Artifact Registry image to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE"             --image="$IMAGE"             --region="$GCP_REGION"             --project="$GCP_PROJECT_ID"             --platform=managed             --allow-unauthenticated             --port=3000             --update-env-vars="^@^NODE_ENV=production@PUBLIC_APP_URL=https://restaurantos01.ai.studio@ALLOWED_ORIGINS=https://restaurantos01.ai.studio,https://antos01.ai.studio,https://restaurantos-xqi52dpwga-el.a.run.app,https://scrrana2000-sys.github.io@SYSTEM_SERVER_UID=restaurantos-system-server@FIREBASE_PROJECT_ID=project-0edd3716-fc3b-40b7-b96@FIRESTORE_DATABASE_ID=ai-studio-restaurantos-16bfb108-09a4-44fb-9463-1d58d938bd57"             --remove-secrets="SYSTEM_SERVER_PASSWORD,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET"             --quiet

      - name: Verify Cloud Run revision and health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            CREATED="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.latestCreatedRevisionName)')"
            READY="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.latestReadyRevisionName)')"
            echo "Cloud Run revision status: created=$CREATED ready=$READY (attempt $attempt/30)"
            if [ -n "$CREATED" ] && [ "$CREATED" = "$READY" ]; then
              URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
              test -n "$URL"
              echo "Cloud Run URL: $URL"
              curl --fail --silent --show-error --retry 6 --retry-delay 3 "$URL/api/health"
              curl --fail --silent --show-error --retry 6 --retry-delay 3 "$URL/"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Cloud Run latest revision did not become ready within 5 minutes."
          gcloud run revisions describe "$CREATED" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='yaml(metadata.name,status.conditions,status.containerStatuses,spec.containers)' || true
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$CLOUD_RUN_SERVICE AND resource.labels.revision_name=$CREATED" --project "$GCP_PROJECT_ID" --limit=80 --order=desc --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          exit 1
