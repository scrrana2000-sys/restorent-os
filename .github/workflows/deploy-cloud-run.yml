name: Deploy RestaurantOS API to Cloud Run
# GitHub OIDC/WIF deployment connection verified.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run security audit, type-check, tests, and production build
        run: npm run verify

  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    needs: verify
    env:
      # Keep deployment/auth configuration at job scope so it is available to
      # validation, auth, deploy, and post-deploy health-check steps.
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Google Cloud deployment configuration
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "Google Cloud auth: Workload Identity Federation configured."
          elif [ -n "$GCP_CREDENTIALS_JSON" ]; then
            echo "Google Cloud auth: service-account JSON configured."
          else
            echo "::error::Google Cloud deployment credentials are missing."
            echo "::error::Configure GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT (recommended), or GCP_CREDENTIALS_JSON."
            exit 1
          fi

          test -n "$CLOUD_RUN_SERVICE" || { echo "::error::CLOUD_RUN_SERVICE is missing."; exit 1; }
          test -n "$GCP_REGION" || { echo "::error::GCP_REGION is missing."; exit 1; }
          test -n "$GCP_PROJECT_ID" || { echo "::error::GCP_PROJECT_ID is missing."; exit 1; }

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with Service Account JSON
        if: ${{ env.GCP_CREDENTIALS_JSON != '' && (env.WIF_PROVIDER == '' || env.WIF_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          source: .
          env_vars: |
            NODE_ENV=production
            PORT=3000
            PUBLIC_APP_URL=https://restaurantos01.ai.studio
            ALLOWED_ORIGINS=https://restaurantos01.ai.studio,https://restaurantos-xqi52dpwgo-as.a.run.app
            SYSTEM_SERVER_UID=restaurantos-system-server
          flags: '--allow-unauthenticated'
          secrets: |
            RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest
            RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest
            RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest

      - name: Verify deployed API health endpoint
        run: |
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          test -n "$URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/api/health"
